kotlinxSerializationJson = "1.8.1"
googleServices = "4.4.2"
credentials = "1.3.0"
googleId = "1.1.1"
material = "1.12.0"

[libraries]
osmdroid-android = { group = "org.osmdroid", name = "osmdroid-android", version.ref = "osmdroid" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
