# Integración continua de NachoQuest: en cada push a main y en cada pull request corre las
# pruebas unitarias y compila el APK de debug y el de release (con R8, para detectar a tiempo
# reglas de ProGuard que falten). Es gratis porque el repositorio es público.
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Si llega un push nuevo al mismo PR, se cancela la ejecución anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest

      - name: APK de debug y de release
        # Sin keystore.properties, el release se firma con la llave de depuración (ver README)
        run: ./gradlew assembleDebug assembleRelease

      - name: Reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: nachoquest-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
